[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/keeprun/keeprun"

[workspace.dependencies]
keeprun-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
